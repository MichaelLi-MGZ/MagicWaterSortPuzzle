apply plugin: 'com.android.library'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // Android Resolver Dependencies Start
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Assets/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:12
    implementation 'com.google.android.gms:play-services-ads:23.0.0' // Assets/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:7
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0' // Assets/GoogleMobileAds/Editor/GoogleUmpDependencies.xml:7
    implementation 'com.unity3d.ads:unity-ads:[4.12.0,4.13[' // Packages/com.unity.ads/Editor/Source/Dependencies.xml:7
    // Android Resolver Dependencies End
    // Core MySDK
    implementation 'com.mygamez.mysdk:mysdk:5.0.0'
    // Test modules (for development)
    //implementation 'com.mygamez.mysdk.mysdk:core:5.0.0'
    implementation 'com.mygamez.mysdk.aurora:login:5.0.0'
    implementation 'com.mygamez.mysdk.aurora:core:5.0.0'
    implementation 'com.mygamez.mysdk.wechat:login:5.0.0'
    implementation 'com.mygamez.mysdk.wechat:core:5.0.0'
    implementation 'com.mygamez.mysdk.wechat:billing:5.0.0'
    implementation 'com.mygamez.mysdk.alipay:billing:5.0.0'


    

    // MSA OAID module (needed only if you use OAID)
    //implementation ("com.mygamez.mysdk.msa:oaid:5.0.0")

**DEPS**}

repositories {
    google()
    mavenCentral()
    mavenLocal()
    // MySDK private Maven repository
    maven { ///maven
        url 'https://packages.ci.mygamez.cloud/api/packages/maven/maven'
        credentials {
            username = MYSDK_MAVEN_USER
            password = MYSDK_MAVEN_PASS
        }
    }
}

// Android Resolver Exclusions Start
android {
  packagingOptions {
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/armeabi-v7a/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
  }
}
// Android Resolver Exclusions End
android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    compileSdkVersion **APIVERSION**
    buildToolsVersion '**BUILDTOOLS**'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion **MINSDKVERSION**
        targetSdkVersion **TARGETSDKVERSION**
        ndk {
            abiFilters **ABIFILTERS**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
    }

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING_OPTIONS**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
